<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">Claude Code 확장 생태계: "누가 호출하는가"</text>
  <!-- center -->
  <circle cx="480" cy="300" r="95" fill="#1f2937"/>
  <text x="480" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Claude Code</text>
  <text x="480" y="318" text-anchor="middle" font-size="14" fill="#d1d5db">(에이전트 + 도구)</text>
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="480" y1="205" x2="480" y2="150"/>
    <line x1="400" y1="250" x2="270" y2="190"/>
    <line x1="560" y1="250" x2="690" y2="190"/>
    <line x1="390" y1="330" x2="260" y2="370"/>
    <line x1="570" y1="330" x2="700" y2="370"/>
    <line x1="430" y1="383" x2="380" y2="440"/>
    <line x1="530" y1="383" x2="580" y2="440"/>
  </g>
  <g font-size="15">
    <rect x="370" y="70" width="220" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="480" y="100" text-anchor="middle" font-weight="700" fill="#92400e">📄 CLAUDE.md</text>
    <text x="480" y="122" text-anchor="middle" fill="#374151">항상 자동 로드</text>
    <text x="480" y="141" text-anchor="middle" font-size="13" fill="#6b7280">프로젝트 맥락·규칙</text>

    <rect x="60" y="130" width="220" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="170" y="160" text-anchor="middle" font-weight="700" fill="#1e40af">⌨️ 슬래시 커맨드</text>
    <text x="170" y="182" text-anchor="middle" fill="#374151">사용자가 직접 호출</text>
    <text x="170" y="201" text-anchor="middle" font-size="13" fill="#6b7280">자주 쓰는 프롬프트</text>

    <rect x="680" y="130" width="220" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="790" y="160" text-anchor="middle" font-weight="700" fill="#166534">📚 스킬</text>
    <text x="790" y="182" text-anchor="middle" fill="#374151">Claude가 상황 보고 판단</text>
    <text x="790" y="201" text-anchor="middle" font-size="13" fill="#6b7280">작업 지식·절차 묶음</text>

    <rect x="40" y="335" width="220" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="150" y="365" text-anchor="middle" font-weight="700" fill="#5b21b6">🧑‍🤝‍🧑 서브에이전트</text>
    <text x="150" y="387" text-anchor="middle" fill="#374151">Claude·사용자가 위임</text>
    <text x="150" y="406" text-anchor="middle" font-size="13" fill="#6b7280">독립 컨텍스트, 역할별</text>

    <rect x="700" y="335" width="220" height="80" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="810" y="365" text-anchor="middle" font-weight="700" fill="#991b1b">🚦 훅</text>
    <text x="810" y="387" text-anchor="middle" fill="#374151">이벤트 발생 시 자동</text>
    <text x="810" y="406" text-anchor="middle" font-size="13" fill="#6b7280">반드시 지킬 규칙 강제</text>

    <rect x="250" y="440" width="220" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="360" y="470" text-anchor="middle" font-weight="700" fill="#075985">🔌 MCP / 커넥터</text>
    <text x="360" y="492" text-anchor="middle" fill="#374151">Claude가 도구로 호출</text>
    <text x="360" y="511" text-anchor="middle" font-size="13" fill="#6b7280">외부 시스템·데이터 연결</text>

    <rect x="490" y="440" width="220" height="80" rx="12" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
    <text x="600" y="470" text-anchor="middle" font-weight="700" fill="#1f2937">🖼️ 아티팩트</text>
    <text x="600" y="492" text-anchor="middle" fill="#374151">결과물로 생성</text>
    <text x="600" y="511" text-anchor="middle" font-size="13" fill="#6b7280">문서·대시보드 공유</text>
  </g>
  <rect x="20" y="230" width="920" height="0" fill="none"/>
  <text x="480" y="548" text-anchor="middle" font-size="14" fill="#6b7280">📦 플러그인 = 위 구성 요소들을 묶어 팀·조직에 배포하는 단위</text>
</svg>
